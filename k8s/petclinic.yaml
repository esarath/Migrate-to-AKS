apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app: spring-petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: replace-with-service-connector-account
      containers:
        - name: petclinic
          image: replace-with-acr-login-server.azurecr.io/petclinic:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sc-postgresflexible-secret
                  key: AZURE_POSTGRESQL_USERNAME
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sc-postgresflexible-secret
                  key: AZURE_POSTGRESQL_CLIENTID
            - name: AZURE_MANAGED_IDENTITY_NAME
              valueFrom:
                secretKeyRef:
                  name: sc-postgresflexible-secret
                  key: AZURE_POSTGRESQL_CLIENTID
            - name: AZURE_POSTGRESQL_HOST
              valueFrom:
                secretKeyRef:
                  name: sc-postgresflexible-secret
                  key: AZURE_POSTGRESQL_HOST
            - name: AZURE_POSTGRESQL_PORT
              valueFrom:
                secretKeyRef:
                  name: sc-postgresflexible-secret
                  key: AZURE_POSTGRESQL_PORT
            - name: AZURE_POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: sc-postgresflexible-secret
                  key: AZURE_POSTGRESQL_DATABASE
            - name: POSTGRES_URL
              value: "jdbc:postgresql://$(AZURE_POSTGRESQL_HOST):$(AZURE_POSTGRESQL_PORT)/$(AZURE_POSTGRESQL_DATABASE)?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin"
            - name: SPRING_DATASOURCE_URL
              value: "$(POSTGRES_URL)"
            - name: SPRING_DATASOURCE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_CLOUD_AZURE_CREDENTIAL_MANAGED_IDENTITY_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
spec:
  type: LoadBalancer
  selector:
    app: spring-petclinic
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
